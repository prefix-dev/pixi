[workspace]
channels = ["https://conda.modular.com/max", "https://prefix.dev/conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.34", archspec = "x86_64_v3" }]
preview = ["pixi-build"]

[workspace.build-variants]
mojo_accelerator = ["cpu", "gfx1100", "gfx1103"]

[package]
name = "mojo-accelerator-test"
version = "1.0.0"

[package.build.backend]
name = "pixi-build-mojo"
version = "*"

[[package.build.config.bins]]
name = "mojo-accelerator-test"
path = "main.mojo"

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.host-dependencies]
max-core = "==26.7.0"
