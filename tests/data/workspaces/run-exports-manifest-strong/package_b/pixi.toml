[package]
name = "package_b"
version = "0.1.0"

[package.build]
backend = { name = "in-memory", version = "*" }

[package.build.config]
noarch = false

# The strong export must reach consumers that build-depend on this package.
[package.run-exports.strong]
package_b = { path = "." }

# The weak bucket must NOT reach a consumer that only build-depends on this
# package. The canary does not exist anywhere (the workspace has no
# channels), so a leak of the weak bucket fails the consumer's solve.
[package.run-exports.weak]
weak-canary-that-does-not-exist = "==99.99.99"
