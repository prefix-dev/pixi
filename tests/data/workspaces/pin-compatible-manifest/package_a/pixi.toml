[package]
name = "package_a"
version = "0.1.0"

[package.build]
backend = { name = "in-memory", version = "*" }

[package.build.config]
noarch = false

[package.host-dependencies]
package_b = { path = "../package_b" }

# Pin the run dependency to the version that the host environment resolved,
# using the rattler-build defaults (`>=0.1.0,<1.0a0` for `0.1.0`).
[package.run-dependencies]
package_b = { pin-compatible = true }
