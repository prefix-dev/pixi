[package]
name = "package_b"
version = "0.1.0"

[package.build]
backend = { name = "in-memory", version = "*" }

[package.build.config]
noarch = false

[package.run-exports.weak]
package_b = { path = "." }

# A constraint never pulls a package in, so an unavailable name is harmless
# to the solve; it must show up in the consumer's `constrains`.
[package.run-exports.weak-constraints]
constrained-canary = ">=2"
