[package]
name = "package_b"
version = "0.1.0"

[package.build]
backend = { name = "in-memory", version = "*" }

[package.build.config]
noarch = false

# Export the package itself, pinned to the built version with the
# rattler-build default bounds.
[package.run-exports.weak]
package_b = { pin-subpackage = true }
