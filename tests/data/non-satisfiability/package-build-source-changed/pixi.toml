[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64"]
preview = ["pixi-build"]

# The workspace depends on its own package, whose `build.source` has been
# changed to `./source-files` since the lock file was written (the lock still
# records `..`). That must invalidate the lock file.
[package]
name = "self-package"
version = "0.1.0"

[package.build]
backend = { name = "in-memory", version = "*" }
source = { path = "./source-files" }

[dependencies]
self-package = { path = "." }
