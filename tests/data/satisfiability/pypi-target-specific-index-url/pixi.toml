# Regression for the review comment on #6505: `pypi-options.index-url` scoped
# to a `[target.<selector>]` table must be evaluated per platform when
# checking satisfiability, not from the lock file's environment-level
# (unioned) index list. Here two named platforms share the same `win-64`
# subdir but each points at a different index, and the lock file should
# satisfy both independently.

[workspace]
channels = ["conda-forge"]
name = "pypi-target-specific-index-url"
platforms = [
  { name = "variant-cuda", platform = "win-64" },
  { name = "variant-cpu", platform = "win-64" },
]
version = "0.1.0"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
my-dep = "==1.0.0"

[target.variant-cuda.pypi-options]
index-url = "https://cuda.example.com/simple"

[target.variant-cpu.pypi-options]
index-url = "https://cpu.example.com/simple"
