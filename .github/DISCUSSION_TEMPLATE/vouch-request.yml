body:
  - type: markdown
    attributes:
      value: |
        To mitigate spam, Pixi only accepts pull requests from vouched contributors, see [CONTRIBUTING.md](https://github.com/prefix-dev/pixi/blob/main/CONTRIBUTING.md).
        If you are already vouched for another prefix-dev project such as [rattler](https://github.com/conda/rattler), you don't need to request it again.
        Keep it short and write it yourself, not with an AI.
        A vouch is not approval of a specific change: still agree on it with a maintainer before opening a pull request.
  - type: textarea
    id: change
    attributes:
      label: What do you want to change?
      description: Link the issue if there is one.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why?
    validations:
      required: true
