[package]
authors.workspace = true
description = "Micro-benchmarks for hot paths in pixi"
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "pixi_bench"
publish = false
readme.workspace = true
repository.workspace = true
version = "0.1.0"

[features]
# Force `sha2` 0.10 onto its portable software backend so the hardware-backed
# default can be measured against it. `scripts/bench-sha256.sh` uses this to
# produce a before/after comparison in a single run.
#
# `force-soft` takes precedence over `asm` inside `sha2`, so this wins even
# though the target-specific dependency below asks for `asm`.
force-soft = ["sha2/force-soft"]

[dependencies]
criterion = { workspace = true }
rattler_digest = { workspace = true }
sha2 = { workspace = true }

# Mirror the production configuration from `crates/pixi_install_pypi/Cargo.toml`
# so that a default `cargo bench` measures what pixi actually ships.
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[[bench]]
harness = false
name = "sha256"
