[package]
name = "pixi_reporters"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Progress reporting infrastructure for pixi"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Standard library
fs-err = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }

# Progress and UI
console = { workspace = true }
indicatif = { workspace = true }

# Utilities
human_bytes = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

# Pixi ecosystem
pixi_build_discovery = { workspace = true }
pixi_command_dispatcher = { workspace = true }
pixi_compute_reporters = { workspace = true }
pixi_config = { workspace = true }
pixi_consts = { workspace = true }
pixi_git = { workspace = true }
pixi_progress = { workspace = true }

# Rattler ecosystem
rattler = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_redaction = { workspace = true }
rattler_repodata_gateway = { workspace = true }

# UV ecosystem
uv-configuration = { workspace = true }
uv-distribution = { workspace = true }
uv-distribution-types = { workspace = true }
uv-installer = { workspace = true }
uv-normalize = { workspace = true }
uv-redacted = { workspace = true }
uv-resolver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
