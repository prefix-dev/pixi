[package]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "pixi_install_pypi"
readme.workspace = true
repository.workspace = true
version = "0.1.0"

# `sha2` is not referenced from any of our code, we depend on it only to turn on
# a feature for the vendored `uv` crates. See the target-specific dependency
# below.
[package.metadata.cargo-shear]
ignored = ["sha2"]

[dependencies]
ahash = { workspace = true }
console = { workspace = true }
csv = { workspace = true }
fancy_display = { workspace = true }
fs-err = { workspace = true }
itertools = { workspace = true }
miette = { workspace = true }
pep440_rs = { workspace = true }
pep508_rs = { workspace = true }
percent-encoding = { workspace = true }
pixi_consts = { workspace = true }
pixi_git = { workspace = true }
pixi_manifest = { workspace = true, features = ["rattler_lock"] }
pixi_path = { workspace = true }
pixi_progress = { workspace = true }
pixi_python_status = { workspace = true }
pixi_record = { workspace = true }
pixi_reporters = { workspace = true }
pixi_utils = { workspace = true, default-features = false }
pixi_uv_context = { workspace = true }
pixi_uv_conversions = { workspace = true }
pypi_modifiers = { workspace = true }
rattler = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_lock = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
typed-path = { workspace = true }
url = { workspace = true }
uv-cache = { workspace = true }
uv-cache-info = { workspace = true }
uv-client = { workspace = true }
uv-configuration = { workspace = true }
uv-dispatch = { workspace = true }
uv-distribution = { workspace = true }
uv-distribution-filename = { workspace = true }
uv-distribution-types = { workspace = true }
uv-flags = { workspace = true }
uv-git = { workspace = true }
uv-install-wheel = { workspace = true }
uv-installer = { workspace = true }
uv-normalize = { workspace = true }
uv-pep440 = { workspace = true }
uv-pep508 = { workspace = true }
uv-preview = { workspace = true }
uv-pypi-types = { workspace = true }
uv-python = { workspace = true }
uv-redacted = { workspace = true }
uv-resolver = { workspace = true }
uv-types = { workspace = true }
uv-workspace = { workspace = true }

# Installing a wheel means hashing it, both to validate the digest pinned in the
# lock file and to key the unzipped wheel in uv's cache. `sha2` 0.10 (the
# version the vendored `uv` crates use) only reaches for the ARMv8 SHA-2
# instructions when its `asm` feature is enabled; without it, aarch64 falls back
# to the portable software backend, which is several times slower.
#
# We do not use `sha2` directly, we depend on it purely so that Cargo's feature
# unification turns the feature on for `uv-extract` and friends as well. The
# conda side of pixi goes through `rattler_digest`, which is on `sha2` 0.11 and
# already picks the hardware backend up at runtime on its own.
#
# On aarch64 the fast path is `sha2`'s own intrinsics, the `sha2-asm` crate that
# the feature also pulls in is only used on x86. Windows is excluded because
# `sha2-asm` assembles its `.S` sources with `cc`, which MSVC cannot do.
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
assert_matches = { workspace = true }
rattler_digest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
uv-cache = { workspace = true }
uv-cache-info = { workspace = true }
