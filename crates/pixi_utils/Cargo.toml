[package]
name = "pixi_utils"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Utilities for use between pixi crates, contains misc features that could not be placed in other crates"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
async-fd-lock = { workspace = true }
filetime = { workspace = true }
fs-err = { workspace = true }
indicatif = { workspace = true }
is_executable = { workspace = true }
itertools = { workspace = true }
miette = { workspace = true }
pep508_rs = { workspace = true }
pixi_auth = { workspace = true }
pixi_config = { workspace = true }
pixi_consts = { workspace = true }
pixi_variant = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_networking = { workspace = true, features = [
  "gcs",
  "netrc-rs",
  "s3",
  "system-integration",
] }
rattler_shell = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
retry-policies = { workspace = true }
rlimit = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uv-configuration = { workspace = true }
webpki = { workspace = true, optional = true }
webpki-root-certs = { workspace = true }
x509-parser = { workspace = true, optional = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
insta = { workspace = true }
rcgen = { workspace = true }
rstest = { workspace = true }
rustls = { workspace = true }
temp-env = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { workspace = true }

[features]
default = ["rustls"]
native-tls = [
  "pixi_auth/native-tls",
  "rattler_networking/native-tls",
  "reqwest/native-tls",
]
rustls = [
  "pixi_auth/rustls",
  "rattler_networking/rustls",
  "reqwest/rustls",
  "dep:webpki",
  "dep:x509-parser",
]
