[package]
name = "pixi_config"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Contains the global configuration for use in a pixi project"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "env", "std"] }
console = { workspace = true }
dirs = { workspace = true }
fs-err = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
miette = { workspace = true }
pixi_consts = { workspace = true }
pixi_toml = { workspace = true }
rattler = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_config = { workspace = true }
rattler_networking = { workspace = true, features = ["s3"] }
rattler_repodata_gateway = { workspace = true, features = ["gateway"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
toml-span = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
rstest = { workspace = true }
temp-env = { workspace = true }

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["fs"] }
