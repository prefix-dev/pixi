[package]
name = "pixi-build-rust"
version = "0.5.6"
edition.workspace = true
description = "A Rust build backend for Pixi"
documentation = "https://prefix-dev.github.io/pixi-build-backends/backends/pixi-build-rust/"
repository.workspace = true
license.workspace = true

[package.metadata.dist]
dist = false

[dependencies]
async-trait = { workspace = true }
cargo_toml = { workspace = true }
fs-err = { workspace = true }
indexmap = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true, features = ["json"] }
once_cell = { workspace = true }
pathdiff = { workspace = true }
pixi_build_backend = { workspace = true }
pixi_build_types = { workspace = true }
rattler_conda_types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

rattler_build_recipe = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["filters", "redactions", "yaml"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["rustls"]
native-tls = ["pixi_build_backend/native-tls"]
rustls = ["pixi_build_backend/rustls"]
