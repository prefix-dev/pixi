[files]
extend-exclude = [
  ".git/",
  ".pixi/",
  ".claude/",
  "**/*.snap",
  "tests/data/mapping_files/*",
  "crates/pixi_build_r/bioconductor_mapping/*",
  "examples/**/**.ipynb",
  "robostack.yaml",
  "checkouts/",
]
ignore-hidden = false

[default.extend-identifiers]
_placehold = "_placehold"
arange = "arange"
intoto = "intoto"
plt-setp = "plt.setp"
solvePnPRansac = "solvePnPRansac"

[default.extend-words]
# The short platform aliases (`p1`, `p2`, ...) older pixi versions wrote to
# `pixi.lock` are referred to as `pN` in identifiers and docs.
pn = "pn"
