[files]
extend-exclude = [
  ".git/",
  ".pixi/",
  ".claude/",
  "**/*.snap",
  "tests/data/mapping_files/*",
  "examples/**/**.ipynb",
  "robostack.yaml",
  "checkouts/",
]
ignore-hidden = false

[default]
extend-ignore-re = [
  # Suppress inline with `// spellchecker:off` ... `// spellchecker:on`.
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[default.extend-identifiers]
_placehold = "_placehold"
arange = "arange"
intoto = "intoto"
plt-setp = "plt.setp"
solvePnPRansac = "solvePnPRansac"

[default.extend-words]
# The short platform aliases (`p1`, `p2`, ...) older pixi versions wrote to
# `pixi.lock` are referred to as `pN` in identifiers and docs.
pn = "pn"
