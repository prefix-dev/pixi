[workspace]
name = "conda-pypi-integration"
channels = ["conda-forge", "conda-pypi"]
platforms = ["osx-arm64", "win-arm64"]
requires-pixi = ">=0.84.1"

[dependencies]
python = "3.14.*"
boltons = { version = "*", channel = "conda-pypi" }
black = { version = "*", channel = "conda-pypi" }

[tasks]
test = "python check.py"
